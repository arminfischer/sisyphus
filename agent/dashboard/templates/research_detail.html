<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sisyphus — Research #{{ entry.id }}</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0d0d0d;
        color: #d4d4d4;
        padding: 2rem 2.5rem;
        min-height: 100vh;
        line-height: 1.6;
      }

      header {
        margin-bottom: 1.5rem;
      }
      header h1 {
        font-size: 1.3rem;
        font-weight: 600;
        color: #fff;
        letter-spacing: -0.02em;
      }
      header h1 span {
        color: #6366f1;
      }
      .nav {
        margin-top: 0.4rem;
        font-size: 0.78rem;
        color: #555;
      }
      .nav a {
        color: #555;
        text-decoration: none;
        margin-right: 1rem;
      }
      .nav a:hover {
        color: #999;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 0.8rem;
        color: #888;
      }
      .meta .tag {
        display: inline-block;
        background: #1a2e1a;
        color: #6ee7b7;
        padding: 0.1rem 0.5rem;
        border-radius: 4px;
        font-size: 0.72rem;
      }
      .meta .tag.goal-link {
        background: #1e2a5e;
        color: #818cf8;
        text-decoration: none;
      }
      .meta .tag.goal-link:hover {
        background: #2a3a7e;
        color: #a5b4fc;
      }

      .card {
        background: #161616;
        border: 1px solid #252525;
        border-radius: 10px;
        padding: 2rem 2.5rem;
        max-width: 900px;
      }

      /* Rendered markdown */
      .markdown {
        font-size: 0.92rem;
        color: #c8c8c8;
        line-height: 1.7;
      }
      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4 {
        color: #fff;
        font-weight: 600;
        margin-top: 1.5rem;
        margin-bottom: 0.6rem;
        line-height: 1.3;
      }
      .markdown h1 {
        font-size: 1.4rem;
        border-bottom: 1px solid #252525;
        padding-bottom: 0.4rem;
      }
      .markdown h2 {
        font-size: 1.15rem;
      }
      .markdown h3 {
        font-size: 1rem;
        color: #e0e0e0;
      }
      .markdown h4 {
        font-size: 0.9rem;
        color: #b0b0b0;
      }
      .markdown p {
        margin-bottom: 0.8rem;
      }
      .markdown ul,
      .markdown ol {
        margin: 0.5rem 0 0.9rem 1.5rem;
      }
      .markdown li {
        margin-bottom: 0.3rem;
      }
      .markdown a {
        color: #818cf8;
        text-decoration: none;
        word-break: break-word;
      }
      .markdown a:hover {
        text-decoration: underline;
      }
      .markdown code {
        background: #0d0d0d;
        border: 1px solid #252525;
        border-radius: 3px;
        padding: 0.1rem 0.35rem;
        font-family: "Cascadia Code", "Consolas", monospace;
        font-size: 0.82rem;
        color: #e0e0e0;
      }
      .markdown pre {
        background: #0d0d0d;
        border: 1px solid #252525;
        border-radius: 6px;
        padding: 0.9rem 1rem;
        overflow-x: auto;
        margin: 0.8rem 0;
      }
      .markdown pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 0.8rem;
        color: #c8c8c8;
      }
      .markdown blockquote {
        border-left: 3px solid #2e3a7e;
        padding-left: 1rem;
        margin: 0.8rem 0;
        color: #999;
        font-style: italic;
      }
      .markdown table {
        border-collapse: collapse;
        margin: 0.8rem 0;
        width: 100%;
        font-size: 0.82rem;
      }
      .markdown th,
      .markdown td {
        border: 1px solid #252525;
        padding: 0.4rem 0.6rem;
        text-align: left;
      }
      .markdown th {
        background: #1a1a1a;
        color: #fff;
        font-weight: 600;
      }
      .markdown hr {
        border: none;
        border-top: 1px solid #252525;
        margin: 1.5rem 0;
      }
      .markdown strong {
        color: #fff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>&#9883; <span>Sisyphus</span> — Research #{{ entry.id }}</h1>
      <nav class="nav">
        <a href="/">← dashboard</a>
        <a href="/log">/log</a>
        <a href="javascript:location.reload()">↺ refresh</a>
      </nav>
    </header>

    <div class="meta">
      <span>{{ entry.created_at.strftime('%Y-%m-%d %H:%M') }} UTC</span>
      {% if entry.goal_id %}
      <a class="tag goal-link" href="/#goal-{{ entry.goal_id }}"
        >goal #{{ entry.goal_id }}{% if entry.goal %}: {{ entry.goal.title }}{% endif %}</a
      >
      {% else %}
      <span class="tag">no goal</span>
      {% endif %}
    </div>

    <div class="card">
      <div class="markdown">{{ entry.summary_html | safe }}</div>
    </div>
  </body>
</html>
